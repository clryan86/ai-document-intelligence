[project]
name = "ai-document-intelligence"
version = "1.0.0"
description = "FastAPI document ingestion, search, summarization, and local NLP intelligence workbench"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
